[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "af-confidence"
version = "0.1.0"
description = "Map literature protein variants onto AlphaFold DB models and catch numbering mistakes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
# MCP server for AI assistants; the mcp package needs Python 3.10+
mcp = ["mcp>=2.3,<3; python_version >= '3.10'"]

[project.scripts]
af-confidence = "af_confidence.cli:main"
af-confidence-mcp = "af_confidence.mcp_server:main"

[tool.setuptools]
packages = ["af_confidence"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
