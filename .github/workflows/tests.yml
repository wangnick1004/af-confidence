name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly: check that the live AlphaFold DB / UniProt APIs still work

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest      # no Python 3.9 builds for Ubuntu 26.04
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . pytest
      - name: Tests (offline, against data/cache)
        run: python -m pytest -q
      - name: Command-line smoke test
        shell: bash
        run: |
          set +e
          af-confidence P68871 E6V --cache data/cache --offline > out.txt
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 1
          grep -q "E7V matches" out.txt

  live:
    name: Live APIs (AlphaFold DB, UniProt)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Fresh downloads give the expected answers
        shell: bash
        run: |
          set +e
          af-confidence -f examples/mixed_proteins.txt --cache "$RUNNER_TEMP/live" > out.txt
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 2                       # TTN has no model: data error, exit 2
          grep -q "HBB -> P68871" out.txt
          grep -q "E7V matches" out.txt
          grep -q "E366K matches" out.txt
          grep -q "no AlphaFold DB model" out.txt
      - name: Colab notebook runs top to bottom (this commit's code, live data)
        run: |
          python -m pip install nbclient nbformat ipykernel pandas
          python scripts/check_notebook.py examples/colab_quickstart.ipynb --local "$GITHUB_WORKSPACE"
